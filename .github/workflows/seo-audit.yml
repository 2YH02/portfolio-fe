name: SEO Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8086
      NEXT_PUBLIC_SUPABASE_URL: https://seo-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: seo-fixture-public-key
      SEO_FIXTURE: "1"

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Verify code and initial blog HTML
        run: npm run lint && npm test

      - name: Start read-only fixture API
        run: |
          node scripts/seo-fixture.mjs > seo-fixture.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8086/posts > /dev/null; then exit 0; fi
            sleep 1
          done
          cat seo-fixture.log
          exit 1

      - name: Build this commit
        run: npm run build

      - name: Start production app
        run: |
          npm run start > seo-app.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat seo-app.log
          exit 1

      - name: Check canonical, sitemap and crawlable content
        run: npm run seo:check

      - name: Checkout seo-better
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: actions/checkout@v4
        with:
          repository: 2YH02/seo-better
          ref: 8bed493e01f18a0e3687236aa70e7397db5dac1c
          path: seo-better
          token: ${{ secrets.SEO_BETTER_TOKEN }}

      - name: Install & Build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        working-directory: seo-better
        run: pnpm install --frozen-lockfile && pnpm run build:core && pnpm run build:cli

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        working-directory: seo-better
        run: pnpm --filter @seo-better/cli exec playwright install chromium --with-deps

      - name: Run SEO audit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        id: seo
        continue-on-error: true
        run: |
          mapfile -t URLS < <(node -e "fetch('http://localhost:3000/sitemap.xml').then(r => { if (!r.ok) throw new Error('sitemap failed'); return r.text(); }).then(xml => { for (const match of xml.matchAll(/<loc>(.*?)<\/loc>/g)) console.log(match[1].replace('https://www.yonghun.me', 'http://localhost:3000')); }).catch(e => { console.error(e); process.exitCode = 1; })")
          if [ "${#URLS[@]}" -eq 0 ]; then echo "No audit URLs"; exit 1; fi
          node seo-better/packages/cli/dist/cli.js \
            --fail-on fail \
            --diff \
            --json \
            "${URLS[@]}" | tee seo-report.json

      - name: Comment PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && hashFiles('seo-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('seo-report.json', 'utf8'));
            const results = Array.isArray(report) ? report : [report];

            const totalFails = results.reduce((s, r) => s + (r.audit?.summary?.failed ?? 0), 0);

            const header = totalFails > 0
              ? '## SEO Audit — 수정 필요'
              : '## SEO Audit — 통과';

            const summaryRows = results.map(r => {
              const s = r.audit?.summary;
              const status = (s?.failed ?? 0) > 0 ? 'FAIL' : (s?.warnings ?? 0) > 0 ? 'WARN' : 'PASS';
              return `| ${status} | ${r.url} | ${s?.score ?? '-'} | ${s?.failed ?? '-'} | ${s?.warnings ?? '-'} |`;
            }).join('\n');

            const failLines = results.flatMap(r => {
              const fails = (r.audit?.checks ?? []).filter(c => c.status === 'fail');
              if (fails.length === 0) return [];
              return [
                `**${r.url}**`,
                ...fails.map(c => `- ${c.name}: ${c.message}${c.details ? `\n  > ${c.details}` : ''}`),
                ''
              ];
            });

            const warnLines = results.flatMap(r => {
              const warns = (r.audit?.checks ?? []).filter(c => c.status === 'warn');
              if (warns.length === 0) return [];
              return [
                `**${r.url}**`,
                ...warns.map(c => `- ${c.name}: ${c.message}`),
                ''
              ];
            });

            const diffLines = results.flatMap(r => {
              const entries = r.diff?.entries ?? [];
              const notable = entries.filter(e =>
                e.diffType === 'dom-only' || e.diffType === 'ssr-only' || e.diffType === 'mismatch'
              );
              if (notable.length === 0) return [];
              return [
                `**${r.url}**`,
                ...notable.map(e => {
                  if (e.diffType === 'dom-only') return `- ${e.name}: SSR 없음 → CSR 추가됨 (검색봇 미인식 가능)`;
                  if (e.diffType === 'ssr-only') return `- ${e.name}: SSR 있음 → CSR 제거됨`;
                  return `- ${e.name}: SSR \`${e.ssrValue}\` → CSR \`${e.domValue}\``;
                }),
                ''
              ];
            });

            const lines = [
              header,
              '',
              '| 결과 | URL | 점수 | FAIL | WARN |',
              '|------|-----|:----:|:----:|:----:|',
              summaryRows,
              '',
            ];

            if (failLines.length > 0) {
              lines.push('### FAIL', '', ...failLines);
            }

            if (warnLines.length > 0) {
              lines.push(
                '<details>',
                '<summary>WARN 목록</summary>',
                '',
                ...warnLines,
                '</details>',
              );
            }

            lines.push(
                '<details>',
                '<summary>SSR vs CSR 차이</summary>',
                '',
                ...(diffLines.length > 0 ? diffLines : ['모든 페이지의 SEO 태그가 SSR과 CSR에서 일치합니다.', '']),
                '</details>',
              );

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });

      - name: Fail if audit failed
        if: always() && steps.seo.outcome == 'failure'
        shell: bash
        run: |
          echo "SEO audit failed. Inspect the report and command logs."
          exit 1

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            seo-report.json
            seo-app.log
            seo-fixture.log
